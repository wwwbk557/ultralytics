#!/usr/bin/env python3
PACKAGE = "hk_pose_openvino"

import sys

sys.path.append("/opt/ros/noetic/lib/python3/dist-packages")

from dynamic_reconfigure.parameter_generator_catkin import (
    ParameterGenerator,
    double_t,
    bool_t,
)

gen = ParameterGenerator()

gen.add("conf_threshold", double_t, 0, "final score threshold (quality * color * kind)", 0.30, 0.0, 1.0)
gen.add("quality_threshold", double_t, 0, "quality prefilter before score", 0.05, 0.0, 1.0)
gen.add("nms_threshold", double_t, 0, "per-class NMS IoU threshold", 0.45, 0.0, 1.0)
gen.add("draw_labels", bool_t, 0, "draw class labels", True)
gen.add("draw_points", bool_t, 0, "draw the four corner points", True)

exit(gen.generate(PACKAGE, "hk_pose_openvino", "PoseConfig"))
