# yolo12-pose + PicoPoseNoBox: 骨干/颈部与 yolo12-pose 完全一致, 只把头换成
# "PicoDet-S 风格的轻量无框 Pose 头"(见 ext/pico_pose/head.py)。
#
# 用法(默认 n 尺度, 也可写 model=yolo12s-pose-pico-nobox.yaml 等):
#   python -m ultralytics yolo pose train \
#     model=ext/pico_pose/cfg/yolo12-pose-pico-nobox.yaml \
#     data=/home/wbk/train_data/0802_1/windmill_4pt_pose.yaml \
#     imgsz=480,640 epochs=300 batch=16 device=0
#
# nc / kpt_shape 会被数据集 yaml 自动覆盖, 这里的值只是占位。

# Parameters
nc: 1 # number of classes
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12n backbone (与 yolo12-pose.yaml 逐行相同)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

# YOLO12n head (颈部与 yolo12-pose.yaml 逐行相同)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)

  # 唯一改动: Pose -> PicoPoseNoBox(无框 + 共享深度可分离特征 + 1x1 cls/reg)
  - [[14, 17, 20], 1, PicoPoseNoBox, [nc, kpt_shape]] # PicoPoseNoBox(P3, P4, P5)
